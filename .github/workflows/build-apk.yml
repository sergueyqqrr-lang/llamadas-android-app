name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar plataforma y build-tools necesarios
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x ./gradlew

      - name: Compilar APK (debug)
        run: ./gradlew assembleDebug --stacktrace

      - name: Subir APK como resultado descargable
        uses: actions/upload-artifact@v4
        with:
          name: llamadas-por-datos-apk
          path: app/build/outputs/apk/debug/*.apk
